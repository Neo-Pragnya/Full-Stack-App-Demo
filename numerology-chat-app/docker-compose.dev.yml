# Development Docker Compose
# Use this for development with hot reload and debugging
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: numerology-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - CORS_ORIGINS=http://localhost,http://localhost:4200,http://localhost:80
    volumes:
      - ./backend/app:/app/app
      - backend_logs:/app/logs
      - backend_data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    networks:
      - numerology-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: numerology-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["npm", "start"]
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - numerology-network

volumes:
  backend_logs:
    driver: local
  backend_data:
    driver: local

networks:
  numerology-network:
    driver: bridge